name: Günlük mevzuat senkronizasyonu

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mevzuat-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Unit testler
        run: python -m unittest discover -s tests -v

      - name: Resmî katalog farkı + dönen içerik kontrolü
        run: >-
          python betikler/resmi_api.py
          --mode daily
          --types KANUN,MULGA
          --delay 0.60
          --min-documents 1000
          --rotation-buckets 28
          --max-backfill 20

      - name: Metadata doğrulaması
        run: python betikler/dogrula.py

      - name: Diff kontrolü
        run: git diff --check

      - name: Değişiklik kontrolü
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- kanunlar indeks.json .mevzuat-catalog.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Resmî kaynak ile repo zaten aynı."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- kanunlar indeks.json .mevzuat-catalog.json > /tmp/mevzuat-status.txt
            sed -n '1,120p' /tmp/mevzuat-status.txt
          fi

      - name: Otomatik veri PR'ı oluştur ve hemen merge et
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/mevzuat-sync"
          DATE="$(date -u +%F)"

          git config user.name "acik-mevzuat-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A kanunlar indeks.json .mevzuat-catalog.json
          git commit -m "chore(data): resmî mevzuat incremental sync $DATE"
          git push --force origin "$BRANCH"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Resmî mevzuat güncellemesi $DATE" \
              --body "Adalet Bakanlığı UYAP/Bedesten resmî katalog ve getDocumentContent API'sinden incremental güncelleme. Tüm corpus günlük yeniden indirilmez; katalog değişiklikleri, eksik backfill ve dönen doğrulama kovası yenilenir.")"
            PR_NUMBER="${PR_URL##*/}"
          fi

          gh pr merge "$PR_NUMBER" --squash --delete-branch

name: Günlük mevzuat senkronizasyonu

on:
  push:
    branches: [main]
    paths:
      - "betikler/senkronize.py"
      - "requirements.txt"
      - ".github/workflows/daily-sync.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mevzuat-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Yürürlükteki ve mülga kanunları senkronize et
        run: python betikler/senkronize.py --types KANUN,MULGA --workers 4 --max-errors 3

      - name: Metadata doğrulaması
        run: python betikler/dogrula.py

      - name: Diff kontrolü
        run: git diff --check

      - name: Değişiklik yoksa çık
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Resmî kaynakta değişiklik yok."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Otomatik veri PR'ı oluştur ve merge et
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/mevzuat-sync"
          DATE="$(date -u +%F)"

          git config user.name "acik-mevzuat-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add kanunlar
          if [ -e indeks.json ]; then
            git add indeks.json
          fi
          git commit -m "chore(data): günlük mevzuat senkronizasyonu $DATE"
          git push --force origin "$BRANCH"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Günlük mevzuat senkronizasyonu $DATE" \
              --body "Adalet Bakanlığı resmî mevzuat kaynağından otomatik üretilen günlük veri güncellemesi.")"
            PR_NUMBER="${PR_URL##*/}"
          fi

          gh pr merge "$PR_NUMBER" --squash --delete-branch

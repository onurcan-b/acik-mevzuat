name: Günlük mevzuat senkronizasyonu

on:
  push:
    branches: [main]
    paths:
      - "betikler/upstream_senkronize.py"
      - "betikler/dogrula.py"
      - "requirements.txt"
      - ".github/workflows/daily-sync.yml"
  schedule:
    # OpenMevzuat'ın günlük resmi-kaynak senkronizasyonundan sonra çalışır.
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mevzuat-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Güncel OpenMevzuat snapshot'ını al
        run: |
          rm -rf /tmp/openmevzuat
          git clone --depth 1 https://github.com/openmevzuat/openmevzuat.git /tmp/openmevzuat
          git -C /tmp/openmevzuat log -1 --oneline

      - name: Tüm güncel kanunları ve Anayasa'yı senkronize et
        run: python betikler/upstream_senkronize.py /tmp/openmevzuat --min-documents 900

      - name: Metadata doğrulaması
        run: python betikler/dogrula.py

      - name: Diff kontrolü
        run: git diff --check

      - name: Değişiklik kontrolü
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- kanunlar indeks.json .openmevzuat-upstream.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream snapshot ile repo zaten aynı."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- kanunlar indeks.json .openmevzuat-upstream.json > /tmp/mevzuat-status.txt
            sed -n '1,100p' /tmp/mevzuat-status.txt
          fi

      # Actions botu burada sadece doğrulanmış veri değişikliklerini PR olarak yayınlar.
      - name: Otomatik veri PR'ı oluştur ve hemen merge et
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/mevzuat-sync"
          DATE="$(date -u +%F)"
          UPSTREAM="$(git -C /tmp/openmevzuat rev-parse --short=12 HEAD)"

          git config user.name "acik-mevzuat-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A kanunlar indeks.json .openmevzuat-upstream.json
          git commit -m "chore(data): mevzuat snapshot $DATE ($UPSTREAM)"
          git push --force origin "$BRANCH"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Günlük mevzuat snapshot'ı $DATE" \
              --body "OpenMevzuat'ın resmi kamu kaynaklarından ürettiği güncel canonical snapshot'ın Açık Mevzuat JSON/Markdown formatına otomatik aktarımı. Upstream: $UPSTREAM. Aynı workflow içinde metadata doğrulaması ve git diff kontrolü başarıyla tamamlandı.")"
            PR_NUMBER="${PR_URL##*/}"
          fi

          gh pr merge "$PR_NUMBER" --squash --delete-branch

name: Resmî Bedesten içerik API smoke testi

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-api-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TCK 5237 tam metnini resmî API'den al
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {"data":{"documentType":"MEVZUAT","id":"103228"},"applicationName":"UyapMevzuat"}
          JSON

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'AdaletApplicationName: UyapMevzuat' \
            -H 'Origin: https://mevzuat.adalet.gov.tr' \
            -H 'Referer: https://mevzuat.adalet.gov.tr/' \
            --data-binary @/tmp/payload.json \
            https://bedesten.adalet.gov.tr/mevzuat/getDocumentContent \
            > /tmp/response.json

          python - <<'PY'
          import base64, json
          p = json.load(open('/tmp/response.json', encoding='utf-8'))
          meta = p.get('metadata') or {}
          data = p.get('data') or {}
          raw = data.get('content') or ''
          mime = data.get('mimeType') or ''
          if meta.get('FMTY') not in (None, 'SUCCESS'):
              raise SystemExit(f"API metadata error: {meta}")
          if not raw:
              raise SystemExit('getDocumentContent returned empty content')
          try:
              decoded = base64.b64decode(raw, validate=False)
          except Exception:
              decoded = str(raw).encode()
          print(f"SUCCESS mime={mime!r} encoded_chars={len(str(raw))} decoded_bytes={len(decoded)}")
          if len(decoded) < 1000:
              raise SystemExit('Content unexpectedly small')
          PY
